name: Documentation issue
description: Report incorrect, missing, or unclear documentation.
title: "docs: "
labels: ["documentation", "triage"]
type: Documentation
body:
  - type: markdown
    attributes:
      value: |
        Before opening a new documentation issue, consider contributing the fix yourself — documentation PRs are a great first contribution. See [CONTRIBUTING.md](https://github.com/saintparish4/antiscaler/blob/master/CONTRIBUTING.md) for guidance.

        For **new documentation requests** (a concept that isn't covered at all) → [open a discussion](https://github.com/saintparish4/antiscaler/discussions/new?category=ideas) instead.

        Thank you for helping us keep the docs accurate!

  - type: dropdown
    id: issue-type
    attributes:
      label: What kind of documentation issue is this?
      options:
        - "Incorrect or misleading information"
        - "Missing documentation"
        - "Outdated / stale content"
        - "Unclear explanation"
        - "Broken or wrong code example"
        - "Typo / formatting"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Which area of the docs is affected?
      options:
        - "Getting started / quickstart"
        - "Config reference (antiscale.config.ts)"
        - "CLI reference"
        - "Caching"
        - "Workspace / monorepo setup"
        - "Framework integration — Next.js"
        - "Framework integration — Vite"
        - "Tracer plugin"
        - "TypeScript API"
        - "Architecture / internals"
        - "Other"
    validations:
      required: true

  - type: input
    id: page-link
    attributes:
      label: Link to the affected page or section
      description: URL of the docs page, or the file path if it lives in the repository (e.g. `docs/caching.md`).
      placeholder: "https://... or docs/caching.md"

  - type: textarea
    id: issue-description
    attributes:
      label: What is the documentation issue?
      description: Describe what is wrong, missing, or confusing. Be as specific as possible — quote the problematic text if relevant.
      placeholder: |
        The caching page says input globs are hashed with MD5, but the implementation uses SHA-256. The example `antiscale.config.ts` on the quickstart page also uses the old `inputs` key which was renamed to `inputGlobs` in v1.0.0.
    validations:
      required: true

  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested correction or improvement
      description: If you know what the docs should say, include it here. Even a rough draft helps.
      placeholder: |
        Replace "MD5" with "SHA-256" on the caching page, and update the config key from `inputs` to `inputGlobs` in all examples.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Anything else that helps — the version of antiscaler you were reading docs for, related issues, etc.
