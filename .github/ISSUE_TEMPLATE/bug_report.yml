name: Bug report
description: Something in antiscaler isn't working the way it should.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including the command you ran.
      placeholder: |
        I ran `antiscaler build` and got ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: |
        I expected the build task to ...
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: |
        A small `antiscale.config.ts` plus the commands you ran. The smaller
        the repro, the faster this gets fixed.
      render: typescript
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: antiscaler version
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node version (`node --version`)
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or stack traces
      render: shell