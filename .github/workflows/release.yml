# release-please watches every push to alpha, reads conventional commits,
# and maintains a "Release PR" that bumps package.json + CHANGELOG.md.
# Merging that PR creates the GitHub Release and triggers the publish job.
#
# Commit convention:
#   feat: ...           → minor bump, ### Added in CHANGELOG
#   fix: ...            → patch bump, ### Fixed in CHANGELOG
#   perf: / refactor:   → patch bump, ### Changed in CHANGELOG
#   feat!: / BREAKING CHANGE: <footer>  → major bump
#   chore: / docs: / ci: / test:        → no release PR update

name: Release

on:
  push:
    branches: [alpha]

permissions:
  contents: write       # create releases, push manifest updates
  pull-requests: write  # open / update the Release PR
  id-token: write       # npm provenance attestation

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & Typecheck
        run: pnpm run lint

      - name: Test with coverage
        run: pnpm run test:all

      - name: Build
        run: pnpm run build

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
