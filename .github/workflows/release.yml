# Publishes the package to npm when a version tag is pushed (e.g. v0.2.0).
#
# Prerequisites:
#   - Repository secret NPM_TOKEN: npm automation token with publish scope.
#   - package.json version must match the tag (without the leading "v").
#
# Typical flow: bump version and changelog, commit, then:
#   git tag vX.Y.Z && git push origin vX.Y.Z

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm test:all
      - run: pnpm build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
